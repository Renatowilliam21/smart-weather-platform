; ==============================================================================
; Hardened PHP Security Configuration
; Based on PHP Security Advisory 2026-10-21 (CVE-2026-109618 & CVE-2026-109619)
; ==============================================================================

; [CVE-2026-109619 Mitigação de RCE via Stale Global State]
; Desativa o rastreamento de progresso de upload em sessão antes do parsing da requisição.
session.upload_progress.enabled = 0

; Oculta cabeçalho X-Powered-By evitando fingerprinting e enumeração de versão
expose_php = Off

; [CVE-2026-109618 Mitigação de RCE via OOM Corruption]
; memory_limit = -1 remove o ponto de falha abrupto do alocador interno do PHP.
; O limite real de consumo de memória é garantido pelas fronteiras do container (cgroup).
memory_limit = -1

; Limites rígidos de corpo e arquivos para requisições multipart/POST
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 5

; Proteção contra DoS e complexidade de hash em parsing de inputs
max_input_vars = 1000
max_execution_time = 30
max_input_time = 30

; Desativa exibição de diagnósticos e erros ao cliente final
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
